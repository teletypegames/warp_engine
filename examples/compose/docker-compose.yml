# Example stack: everything WarpEngine needs to come alive, end to end.
#
#   mysql             the catalog database
#   app               a Rails host with the engine mounted from this repo
#                     checkout, ActiveAdmin + Devise for the admin at /admin
#   gitea             (profile "ci") the git forge
#   woodpecker        (profile "ci") CI server + agent, wired to gitea
#
# Everything, wired up (forge, CI, tokens, admin users):
#   bin/setup
#
# Only the catalog and the admin:
#   cp .env.example .env
#   docker compose up -d --build

services:
  mysql:
    image: mysql:8
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-warpengine}
      MYSQL_DATABASE: warp_engine_example
    volumes:
      - mysql-data:/var/lib/mysql

  app:
    build: ./host_app
    ports:
      - "${APP_PORT:-8080}:3000"
    environment:
      RAILS_ENV: development
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-warpengine}
      SITE_URL: http://localhost:${APP_PORT:-8080}
      STORE_NAME: ${STORE_NAME:-My Studio}
      UPDATE_SECRET: ${UPDATE_SECRET:-example-update-secret}
      FILE_CONTAINER_PATH: /softwares
      IMAGE_CONTAINER_PATH: /images
      GITEA_URL: ${GITEA_URL:-}
      GITEA_API_TOKEN: ${GITEA_API_TOKEN:-}
      GITEA_OWNER: ${GITEA_OWNER:-games}
      WOODPECKER_URL: ${WOODPECKER_URL:-}
      WOODPECKER_API_TOKEN: ${WOODPECKER_API_TOKEN:-}
      WOODPECKER_PUBLIC_KEY_URL: ${WOODPECKER_PUBLIC_KEY_URL:-}
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./host_app:/app
      - ../..:/warp_engine
      - bundle:/usr/local/bundle
      - softwares:/softwares
      - images:/images

  gitea:
    image: gitea/gitea:1.27.3
    profiles: ["ci"]
    environment:
      GITEA__security__INSTALL_LOCK: "true"
      GITEA__server__DOMAIN: gitea.localhost
      GITEA__server__HTTP_PORT: ${GITEA_PORT:-3000}
      GITEA__server__ROOT_URL: http://gitea.localhost:${GITEA_PORT:-3000}/
      GITEA__server__SSH_DOMAIN: gitea.localhost
      GITEA__server__SSH_PORT: ${GITEA_SSH_PORT:-2223}
      GITEA__service__DISABLE_REGISTRATION: "true"
      GITEA__webhook__ALLOWED_HOST_LIST: "*"
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:${GITEA_PORT:-3000}/api/healthz"]
      interval: 5s
      retries: 30
    ports:
      - "${GITEA_PORT:-3000}:${GITEA_PORT:-3000}"
      - "${GITEA_SSH_PORT:-2223}:22"
    networks:
      default:
        aliases: [gitea.localhost]
    volumes:
      - gitea-data:/data

  woodpecker:
    image: woodpeckerci/woodpecker-server:v3.20.1
    profiles: ["ci"]
    environment:
      WOODPECKER_HOST: http://woodpecker.localhost:${WOODPECKER_PORT:-8000}
      WOODPECKER_SERVER_ADDR: ":${WOODPECKER_PORT:-8000}"
      WOODPECKER_OPEN: "true"
      WOODPECKER_ADMIN: ${GITEA_ADMIN:-warp}
      WOODPECKER_GITEA: "true"
      WOODPECKER_GITEA_URL: http://gitea:${GITEA_PORT:-3000}
      WOODPECKER_EXPERT_FORGE_OAUTH_HOST: http://gitea.localhost:${GITEA_PORT:-3000}
      WOODPECKER_EXPERT_WEBHOOK_HOST: http://woodpecker:${WOODPECKER_PORT:-8000}
      WOODPECKER_ENVIRONMENT: "GIT_CONFIG_COUNT:1,GIT_CONFIG_KEY_0:url.http://gitea:${GITEA_PORT:-3000}/.insteadOf,GIT_CONFIG_VALUE_0:http://gitea.localhost:${GITEA_PORT:-3000}/"
      WOODPECKER_GITEA_CLIENT: ${WOODPECKER_GITEA_CLIENT:-}
      WOODPECKER_GITEA_SECRET: ${WOODPECKER_GITEA_SECRET:-}
      WOODPECKER_AGENT_SECRET: ${WOODPECKER_AGENT_SECRET:-example-agent-secret}
      WOODPECKER_CONFIG_EXTENSION_ENDPOINT: http://app:3000/build/config
      WOODPECKER_EXTENSIONS_ALLOWED_HOSTS: app
    ports:
      - "${WOODPECKER_PORT:-8000}:${WOODPECKER_PORT:-8000}"
    networks:
      default:
        aliases: [woodpecker.localhost]
    volumes:
      - woodpecker-data:/var/lib/woodpecker

  woodpecker-agent:
    image: woodpeckerci/woodpecker-agent:v3.20.1
    profiles: ["ci"]
    environment:
      WOODPECKER_SERVER: woodpecker:9000
      WOODPECKER_AGENT_SECRET: ${WOODPECKER_AGENT_SECRET:-example-agent-secret}
      WOODPECKER_BACKEND_DOCKER_NETWORK: warp-example
    depends_on:
      - woodpecker
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

networks:
  default:
    name: warp-example

volumes:
  mysql-data:
  bundle:
  softwares:
  images:
  gitea-data:
  woodpecker-data:
