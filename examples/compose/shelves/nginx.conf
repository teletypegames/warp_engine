# The shelves over plain HTTP, read only, with a listing of every folder. Plain because
# the machines they are for (a C64 with a network cartridge) cannot speak TLS.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 256;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    charset utf-8;

    access_log off;
    server_tokens off;
    sendfile on;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    server {
        listen 8080;
        root /softwares/shelves;

        autoindex on;
        autoindex_exact_size on;
        autoindex_localtime off;

        if ($request_method !~ ^(GET|HEAD)$) {
            return 405;
        }

        location ~ /\. {
            return 404;
        }

        location ~* \.(txt|ini|lst|cfg|md)$ {
            types { }
            default_type text/plain;
        }
    }
}
