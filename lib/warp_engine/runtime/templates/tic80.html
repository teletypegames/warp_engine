<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ title }}</title>
<link rel="license" href="{{ runtime_url }}LICENSES.txt">
<style>
  body { margin: 0; padding: 0; background: #000; display: flex; justify-content: center; align-items: center; height: 100vh; }
  .tic80-container { width: 100%; padding-top: 50%; position: relative; }
  .tic80-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; outline-style: none; }
  .tic80-play { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; background: #1a1c2c; color: #fff; display: flex; justify-content: center; align-items: center; image-rendering: pixelated; cursor: pointer; }
</style>
</head>
<body>
<div class="tic80-container">
  <canvas class="tic80-canvas" id="canvas" oncontextmenu="event.preventDefault()" tabindex="1"></canvas>
  <div class="tic80-play" id="tic80-play">
    <img src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABAAAAAQCAYAAAAf8/9hAAAAAXNSR0IArs4c6QAAAF9JREFUOE+d0jsOACAIA1B6/0NjHDB+UFtcnPpC0sLd3cwMAPqvPgQQQRU6ABW6Aiz0BX4QDdwgGdihMjCgvUZlB73y0gXzViQgGxkFvNb5BJhZpwATTFtQggtQCQbQAJ4FQA3PbK2EAAAAAElFTkSuQmCC" alt="Play" width="64" height="64">
  </div>
</div>
<script type="module">
  const receivePayload = (source, asFile) => {
    if (source !== "message") return Promise.resolve(source);
    return new Promise((resolve) => {
      addEventListener("message", (event) => {
        if ((event.source !== parent && event.source !== window) || !event.data || event.data.type !== "warpengine.payload") return;
        const file = new File([event.data.data], event.data.name || "payload", { type: "application/octet-stream" });
        resolve(asFile ? file : URL.createObjectURL(file) + "#" + file.name);
      });
      parent.postMessage({ type: "warpengine.ready" }, "*");
    });
  };
  const runtimeUrl = {{ json runtime_url }}
  const payloadUrl = await receivePayload({{ json payload_url }}, false)
  const canvas = document.querySelector("#canvas")
  const play = document.getElementById("tic80-play")
  const options = {
    canvas,
    arguments: [payloadUrl],
    locateFile: (file) => runtimeUrl + file,
    preRun: [
      (module) => {
        if (module && module.ENV) module.ENV.SDL_EMSCRIPTEN_KEYBOARD_ELEMENT = "#canvas"
      }
    ]
  }
  const source = await (await fetch(runtimeUrl + "tic80.js")).text()
  const start = /export\s+default/.test(source)
    ? async () => (await import(runtimeUrl + "tic80.js")).default(options)
    : async () => {
      window.Module = options
      const script = document.createElement("script")
      script.src = runtimeUrl + "tic80.js"
      document.body.appendChild(script)
    }
  canvas.addEventListener("click", () => canvas.focus())
  play.addEventListener("click", () => {
    play.style.display = "none"
    canvas.focus()
    start()
  })
</script>
</body>
</html>
